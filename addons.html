<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CattyMod Settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* ROOT */
:root {
  --bg: #fff;
  --panel: #f3f3f3;
  --panel2: #e9e9e9;
  --text: #111;
  --accent: #009CCC;
}

body.dark {
  --bg: #111;
  --panel: #1a1a1a;
  --panel2: #1e1e1e;
  --text: #fff;
}

/* PAGE BASE */
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  font-family: Segoe UI, sans-serif;
  background: var(--bg);
  color: var(--text);
}

body {
  display: flex;
  height: 100%;
}

/* SIDEBAR */
.sidebar {
  width: 260px;
  background: var(--panel);
  padding: 20px;
}

.sidebar-header {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 16px;
}

.nav-item {
  padding: 10px;
  border-radius: 6px;
  cursor: pointer;
  margin-top: 6px;
  display: flex;
  gap: 10px;
  align-items: center;
}

.nav-item.active {
  background: var(--accent);
  color: white;
}

/* MAIN LAYOUT FIX */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  height: 100%;
}

.page {
  display: none;
  flex: 1;
  height: 100%;
}

.page.active {
  display: flex;
  flex-direction: column;
}

.content {
  flex: 1;
  padding: 20px;
  overflow: auto;
}

/* SWITCH */
.switch {
  position: relative;
  width: 50px;
  height: 24px;
}

.switch input { display: none; }

.slider {
  position: absolute;
  inset: 0;
  background: #777;
  border-radius: 20px;
  cursor: pointer;
}

.slider:before {
  content: "";
  position: absolute;
  width: 18px;
  height: 18px;
  left: 3px;
  top: 3px;
  background: white;
  border-radius: 50%;
  transition: 0.2s;
}

input:checked + .slider {
  background: var(--accent);
}

input:checked + .slider:before {
  transform: translateX(26px);
}

/* THEME BOX */
.theme-box {
  max-width: 520px;
  margin: auto;
  background: var(--panel);
  padding: 20px;
  border-radius: 12px;
}

/* PREVIEW */
.preview-bar {
  position: relative;
  width: 100%;
  height: 44px;
  border-radius: 8px;
  margin-top: 12px;
  overflow: hidden;
  background: #009CCC;
}

.preview-bar img {
  position: absolute;
  inset: 0;
  width: calc(100% - 24px);
  margin: 0 12px;
  height: 100%;
  object-fit: contain;
}

/* BUTTONS */
button {
  padding: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.save { background: #4CAF50; color: white; }
.reset { background: #f44336; color: white; }

/* ABOUT */
.about-wrapper {
  display: flex;
  gap: 20px;
  align-items: center;
  background: var(--panel);
  padding: 20px;
  border-radius: 12px;
  max-width: 700px;
  margin: auto;
}

.about-logo {
  width: 90px;
  height: 90px;
}

.about-info {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.about-title {
  font-size: 20px;
  font-weight: 600;
}

.about-version {
  width: 140px;
  padding: 8px;
  border-radius: 6px;
  border: none;
}

.about-btn {
  background: var(--accent);
  color: white;
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
  width: fit-content;
}

/* ADDONS FULL FIX */
#addons .content {
  padding: 0;
  display: flex;
  height: 100%;
}

#addonsFrame {
  width: 100%;
  height: 100%;
  border: none;
  outline: none;
  display: block;
}

.hidden { display: none; }

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="sidebar-header">
    <i class="fas fa-gear"></i>
    Settings
  </div>

  <div class="nav-item" onclick="openPage('general', event)">
    <i class="fas fa-house"></i> General
  </div>

  <div class="nav-item" onclick="openPage('appearance', event)">
    <i class="fas fa-paint-brush"></i> Appearance
  </div>

  <div class="nav-item" onclick="openPage('addons', event)">
    <i class="fas fa-puzzle-piece"></i> Addons
  </div>

  <div class="nav-item" onclick="openPage('about', event)">
    <i class="fas fa-circle-info"></i> About
  </div>

</div>

<!-- MAIN -->
<div class="main">

<!-- GENERAL -->
<div id="general" class="page">
  <div class="content">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span>Dark Mode</span>
      <label class="switch">
        <input type="checkbox" id="darkToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>
</div>

<!-- APPEARANCE -->
<div id="appearance" class="page">
  <div class="content">
    <div class="theme-box">

      <h3>Custom Theme</h3>

      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span>Enable Custom Theme</span>
        <label class="switch">
          <input type="checkbox" id="themeToggle">
          <span class="slider"></span>
        </label>
      </div>

      <div id="themeControls">
        <br>
        <input type="color" id="colorPicker">

        <div class="preview-bar" id="previewBar">
          <img src="https://cattymod.app/assets/navbar.png">
        </div>

        <br>
        <button class="save" id="saveBtn">Save</button>
        <button class="reset" onclick="resetTheme()">Reset</button>
      </div>

    </div>
  </div>
</div>

<!-- ADDONS -->
<div id="addons" class="page">
  <div class="content">
    <iframe id="addonsFrame"
      src="https://studio.cattymod.app/addonsEmbed.html">
    </iframe>
  </div>
</div>

<!-- ABOUT -->
<div id="about" class="page">
  <div class="content">
    <div class="about-wrapper">
      <img class="about-logo" src="https://cattymod.app/assets/cattymod-icon-DpwK82Wr.png">
      <div class="about-info">
        <div class="about-title">CattyMod Studio</div>
        <input class="about-version" value="v26.5">
        <button class="about-btn" onclick="window.open('https://cattymod.app','_blank')">
          Open Homepage
        </button>
      </div>
    </div>
  </div>
</div>

</div>

<script>

/* THEME TRACKING */
let lastTheme = localStorage.getItem("tw:theme") || "light";

/* NAV */
function openPage(id, e) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');

  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (e) e.currentTarget.classList.add('active');

  history.replaceState(null, "", "?page=" + id);

  if (id === "addons") {
    reloadIfNeeded();
  }
}

/* ADDONS RELOAD */
function reloadAddons() {
  const iframe = document.getElementById("addonsFrame");
  const base = iframe.src.split("?")[0];
  iframe.src = base + "?t=" + Date.now();
}

function reloadIfNeeded() {
  const currentTheme = localStorage.getItem("tw:theme") || "light";
  if (currentTheme !== lastTheme) {
    reloadAddons();
    lastTheme = currentTheme;
  }
}

/* DARK MODE */
const darkToggle = document.getElementById("darkToggle");

function applyTheme(mode) {
  document.body.classList.toggle("dark", mode === "dark");
  localStorage.setItem("tw:theme", mode);
}

darkToggle.addEventListener("change", () => {
  const newTheme = darkToggle.checked ? "dark" : "light";
  const oldTheme = localStorage.getItem("tw:theme") || "light";

  applyTheme(newTheme);

  if (newTheme !== oldTheme) {
    reloadAddons();
    lastTheme = newTheme;
  }
});

/* INIT */
const saved = localStorage.getItem("tw:theme") || "light";
applyTheme(saved);
darkToggle.checked = saved === "dark";

/* DEFAULT PAGE */
const params = new URLSearchParams(location.search);
const start = params.get("page") || "general";

document.getElementById(start).classList.add("active");
document.querySelectorAll('.nav-item').forEach(n => {
  if (n.getAttribute("onclick")?.includes(`'${start}'`)) {
    n.classList.add("active");
  }
});

</script>

</body>
</html>
