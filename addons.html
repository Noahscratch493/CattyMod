<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CattyMod Settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* ROOT */
:root {
  --bg: #fff;
  --panel: #f3f3f3;
  --panel2: #e9e9e9;
  --text: #111;
  --accent: #009CCC;
}

body.dark {
  --bg: #111;
  --panel: #1a1a1a;
  --panel2: #1e1e1e;
  --text: #fff;
}

/* BASE */
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  font-family: Segoe UI, sans-serif;
  background: var(--bg);
  color: var(--text);
}

body { display: flex; }

/* SIDEBAR */
.sidebar {
  width: 260px;
  background: var(--panel);
  padding: 20px;
}

.sidebar-header {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 16px;
}

.nav-item {
  padding: 10px;
  border-radius: 6px;
  cursor: pointer;
  margin-top: 6px;
  display: flex;
  gap: 10px;
  align-items: center;
}

.nav-item.active {
  background: var(--accent);
  color: white;
}

/* MAIN */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.page {
  display: none;
  flex: 1;
}

.page.active {
  display: flex;
  flex-direction: column;
}

.content {
  flex: 1;
  padding: 20px;
  overflow: auto;
}

/* SWITCH */
.switch { width:50px;height:24px;position:relative; }
.switch input { display:none; }

.slider {
  position:absolute;
  inset:0;
  background:#777;
  border-radius:20px;
  cursor:pointer;
}

.slider:before {
  content:"";
  position:absolute;
  width:18px;height:18px;
  left:3px;top:3px;
  background:white;
  border-radius:50%;
  transition:.2s;
}

input:checked + .slider { background:var(--accent); }
input:checked + .slider:before { transform:translateX(26px); }

/* THEME */
.theme-box {
  max-width:520px;
  margin:auto;
  background:var(--panel);
  padding:20px;
  border-radius:12px;
}

/* ANIMATION */
#themeControls {
  overflow:hidden;
  max-height:500px;
  opacity:1;
  transform:translateY(0);
  transition:max-height .35s ease, opacity .25s ease, transform .25s ease;
}

#themeControls.collapsed {
  max-height:0;
  opacity:0;
  transform:translateY(-10px);
  pointer-events:none;
}

/* PREVIEW */
.preview-bar {
  height:44px;
  border-radius:8px;
  margin-top:12px;
  overflow:hidden;
  background:#009CCC;
  position:relative;
}

.preview-bar img {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  max-width: calc(100% - 24px);
  max-height: 100%;
  object-fit: contain;
}

/* BUTTONS */
button { padding:10px;border:none;border-radius:8px;cursor:pointer; }
.save { background:#4CAF50;color:white; }
.reset { background:#f44336;color:white; }

/* ABOUT */
.about-wrapper {
  display:flex;
  gap:20px;
  align-items:center;
  background:var(--panel);
  padding:20px;
  border-radius:12px;
  max-width:700px;
  margin:auto;
}

.about-logo { width:90px;height:90px; }

.about-title { font-size:20px;font-weight:600; }

.about-version {
  width:140px;
  padding:8px;
  border-radius:6px;
  border:none;
}

.about-btn {
  background:var(--accent);
  color:white;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
}

/* ADDONS FIX */
#addons .content {
  padding:0;
  height:100%;
}

#addonsFrame {
  width:100%;
  height:100%;
  border:none;
  display:block;
}

</style>
</head>

<body>

<div class="sidebar">
  <div class="sidebar-header">
    <i class="fas fa-gear"></i> Settings
  </div>

  <div class="nav-item" data-page="general">
    <i class="fas fa-house"></i> General
  </div>

  <div class="nav-item" data-page="appearance">
    <i class="fas fa-paint-brush"></i> Appearance
  </div>

  <div class="nav-item" data-page="addons">
    <i class="fas fa-puzzle-piece"></i> Addons
  </div>

  <div class="nav-item" data-page="about">
    <i class="fas fa-circle-info"></i> About
  </div>
</div>

<div class="main">

<div id="general" class="page">
  <div class="content">
    <div style="display:flex;justify-content:space-between;">
      <span>Dark Mode</span>
      <label class="switch">
        <input type="checkbox" id="darkToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>
</div>

<div id="appearance" class="page">
  <div class="content">
    <div class="theme-box">
      <h3>Custom Theme</h3>

      <div style="display:flex;justify-content:space-between;">
        <span>Enable Custom Theme</span>
        <label class="switch">
          <input type="checkbox" id="themeToggle">
          <span class="slider"></span>
        </label>
      </div>

      <div id="themeControls">
        <br>
        <input type="color">
        <div class="preview-bar">
          <img src="https://cattymod.app/assets/navbar.png">
        </div>
        <br>
        <button class="save">Save</button>
        <button class="reset">Reset</button>
      </div>
    </div>
  </div>
</div>

<div id="addons" class="page">
  <div class="content">
    <iframe id="addonsFrame" src="https://studio.cattymod.app/addonsEmbed.html"></iframe>
  </div>
</div>

<div id="about" class="page">
  <div class="content">
    <div class="about-wrapper">
      <img class="about-logo" src="https://cattymod.app/assets/cattymod-icon-DpwK82Wr.png">
      <div>
        <div class="about-title">CattyMod Studio</div>
        <input class="about-version" value="v26.5.1">
        <button class="about-btn" onclick="window.open('https://cattymod.app','_blank')">
          Open Homepage
        </button>
      </div>
    </div>
  </div>
</div>

</div>

<script>

/* PAGE SWITCHING */
const navItems = document.querySelectorAll(".nav-item");

function openPage(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  navItems.forEach(n => n.classList.remove("active"));
  document.querySelector(`[data-page="${id}"]`).classList.add("active");

  history.replaceState(null, "", "?page=" + id);
}

/* CLICK NAV */
navItems.forEach(item => {
  item.addEventListener("click", () => {
    openPage(item.dataset.page);
  });
});

/* URL LOAD FIX */
const params = new URLSearchParams(location.search);
const startPage = params.get("page") || "general";
openPage(startPage);

/* DARK MODE */
const darkToggle = document.getElementById("darkToggle");

function applyTheme(mode) {
  document.body.classList.toggle("dark", mode === "dark");
  localStorage.setItem("tw:theme", mode);
}

const savedTheme = localStorage.getItem("tw:theme") || "light";
applyTheme(savedTheme);
darkToggle.checked = savedTheme === "dark";

darkToggle.addEventListener("change", () => {
  applyTheme(darkToggle.checked ? "dark" : "light");
});

/* THEME COLLAPSE */
const themeToggle = document.getElementById("themeToggle");
const themeControls = document.getElementById("themeControls");

function updateThemeControls() {
  themeControls.classList.toggle("collapsed", !themeToggle.checked);
}

const enabled = localStorage.getItem("customTheme") === "true";
themeToggle.checked = enabled;
updateThemeControls();

themeToggle.addEventListener("change", () => {
  localStorage.setItem("customTheme", themeToggle.checked);
  updateThemeControls();
});

</script>

</body>
</html>
