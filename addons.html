<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CattyMod Settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

:root {
  --bg: #fff;
  --panel: #f3f3f3;
  --panel2: #e9e9e9;
  --text: #111;
  --accent: #009CCC;
}

body.dark {
  --bg: #111;
  --panel: #1a1a1a;
  --panel2: #1e1e1e;
  --text: #fff;
}

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  font-family: Segoe UI, sans-serif;
  background: var(--bg);
  color: var(--text);
}

body {
  display: flex;
}

/* SIDEBAR */
.sidebar {
  width: 260px;
  background: var(--panel);
  padding: 20px;
}

.sidebar-header {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 16px;
}

.nav-item {
  padding: 10px;
  border-radius: 6px;
  cursor: pointer;
  margin-top: 6px;
  display: flex;
  gap: 10px;
  align-items: center;
}

.nav-item.active {
  background: var(--accent);
  color: white;
}

/* MAIN */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.page {
  display: none;
  height: 100%;
}

.page.active {
  display: flex;
  flex-direction: column;
}

.content {
  padding: 20px;
  overflow: auto;
  flex: 1;
}

/* SWITCH */
.switch {
  position: relative;
  width: 50px;
  height: 24px;
}

.switch input { display: none; }

.slider {
  position: absolute;
  inset: 0;
  background: #777;
  border-radius: 20px;
  cursor: pointer;
}

.slider:before {
  content: "";
  position: absolute;
  width: 18px;
  height: 18px;
  left: 3px;
  top: 3px;
  background: white;
  border-radius: 50%;
  transition: 0.2s;
}

input:checked + .slider {
  background: var(--accent);
}

input:checked + .slider:before {
  transform: translateX(26px);
}

/* THEME */
.theme-box {
  max-width: 520px;
  margin: auto;
  background: var(--panel);
  padding: 20px;
  border-radius: 12px;
}

/* PREVIEW */
.preview-bar {
  position: relative;
  width: 100%;
  height: 44px;
  border-radius: 8px;
  margin-top: 12px;
  overflow: hidden;
  background: #009CCC;
}

.preview-bar img {
  position: absolute;
  inset: 0;
  width: calc(100% - 24px);
  margin: 0 12px;
  height: 100%;
  object-fit: contain;
}

/* BUTTONS */
button {
  padding: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.save { background: #4CAF50; color: white; }
.reset { background: #f44336; color: white; }

/* ABOUT */
.about-wrapper {
  display: flex;
  gap: 20px;
  align-items: center;
  background: var(--panel);
  padding: 20px;
  border-radius: 12px;
  max-width: 700px;
  margin: auto;
}

.about-logo {
  width: 90px;
  height: 90px;
}

.about-info {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.about-title {
  font-size: 20px;
  font-weight: 600;
}

.about-version {
  width: 140px;
  padding: 8px;
  border-radius: 6px;
  border: none;
}

.about-btn {
  background: var(--accent);
  color: white;
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
  width: fit-content;
}

/* HIDE */
.hidden { display: none; }

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="sidebar-header">
    <i class="fas fa-gear"></i>
    Settings
  </div>

  <div class="nav-item" onclick="openPage('general', event)">
    <i class="fas fa-house"></i> General
  </div>

  <div class="nav-item" onclick="openPage('appearance', event)">
    <i class="fas fa-paint-brush"></i> Appearance
  </div>

  <div class="nav-item" onclick="openPage('addons', event)">
    <i class="fas fa-puzzle-piece"></i> Addons
  </div>

  <div class="nav-item" onclick="openPage('about', event)">
    <i class="fas fa-circle-info"></i> About
  </div>

</div>

<!-- MAIN -->
<div class="main">

<div id="general" class="page">
  <div class="content">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span>Dark Mode</span>
      <label class="switch">
        <input type="checkbox" id="darkToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>
</div>

<div id="appearance" class="page">
  <div class="content">
    <div class="theme-box">
      <h3>Custom Theme</h3>

      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span>Enable Custom Theme</span>
        <label class="switch">
          <input type="checkbox" id="themeToggle">
          <span class="slider"></span>
        </label>
      </div>

      <div id="themeControls">
        <br>
        <input type="color" id="colorPicker">

        <div class="preview-bar" id="previewBar">
          <img src="https://cattymod.app/assets/navbar.png">
        </div>

        <br>
        <button class="save" id="saveBtn">Save</button>
        <button class="reset" onclick="resetTheme()">Reset</button>
      </div>

    </div>
  </div>
</div>

<div id="addons" class="page">
  <div class="content" style="padding:0;">
    <iframe src="https://studio.cattymod.app/addonsEmbed.html"
            style="width:100%;height:100%;border:none;"></iframe>
  </div>
</div>

<div id="about" class="page">
  <div class="content">
    <div class="about-wrapper">
      <img class="about-logo" src="https://cattymod.app/assets/cattymod-icon-DpwK82Wr.png">
      <div class="about-info">
        <div class="about-title">CattyMod Studio</div>
        <input class="about-version" value="v26.5">
        <button class="about-btn" onclick="window.open('https://cattymod.app','_blank')">
          Open Homepage
        </button>
      </div>
    </div>
  </div>
</div>

</div>

<script>

/* NAVIGATION */
function openPage(id, e) {
  openPageById(id);

  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  e.currentTarget.classList.add('active');

  history.replaceState(null, "", "?page=" + id);
}

function openPageById(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const page = document.getElementById(id);
  if (page) page.classList.add('active');

  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.remove('active');
    if (n.getAttribute("onclick")?.includes(`'${id}'`)) {
      n.classList.add('active');
    }
  });

  if (id === "addons") {
    const iframe = document.querySelector("#addons iframe");
    if (iframe) {
      const src = iframe.src;
      iframe.src = "about:blank";
      setTimeout(() => iframe.src = src, 10);
    }
  }
}

/* URL HANDLER */
function getPageFromURL() {
  const params = new URLSearchParams(window.location.search);
  return params.get("page");
}

/* COOKIE SYSTEM */
function setCookie(name, value, days) {
  const d = new Date();
  d.setTime(d.getTime() + days * 86400000);
  document.cookie = `${name}=${value};expires=${d.toUTCString()};path=/`;
}

function getCookie(name) {
  const v = `; ${document.cookie}`;
  const parts = v.split(`; ${name}=`);
  if (parts.length === 2) return parts.pop().split(';').shift();
  return null;
}

function deleteCookie(name) {
  document.cookie = name + "=; Max-Age=-99999999; path=/";
}

/* DARK MODE */
const darkToggle = document.getElementById("darkToggle");

function loadDark() {
  const mode = localStorage.getItem("tw:theme") || "light";
  document.body.classList.toggle("dark", mode === "dark");
  darkToggle.checked = mode === "dark";
}

darkToggle.addEventListener("change", () => {
  const mode = darkToggle.checked ? "dark" : "light";
  localStorage.setItem("tw:theme", mode);
  document.body.classList.toggle("dark", mode === "dark");
});

/* THEME */
const themeToggle = document.getElementById("themeToggle");
const themeControls = document.getElementById("themeControls");
const picker = document.getElementById("colorPicker");
const previewBar = document.getElementById("previewBar");
const saveBtn = document.getElementById("saveBtn");

function loadTheme() {
  const enabled = getCookie("CustomTheme") !== "false";

  themeToggle.checked = enabled;
  themeControls.classList.toggle("hidden", !enabled);

  const color = getCookie("NavColour") || "#009CCC";

  picker.value = color;
  previewBar.style.backgroundColor = color;
}

themeToggle.addEventListener("change", () => {
  if (!themeToggle.checked) {
    setCookie("CustomTheme", "false", 365);
    deleteCookie("NavColour");
    themeControls.classList.add("hidden");
    previewBar.style.backgroundColor = "#009CCC";
  } else {
    setCookie("CustomTheme", "true", 365);
    themeControls.classList.remove("hidden");
  }
});

picker.addEventListener("input", () => {
  previewBar.style.backgroundColor = picker.value;
});

saveBtn.addEventListener("click", () => {
  if (!themeToggle.checked) {
    alert("Enable Custom Theme first!");
    return;
  }
  setCookie("NavColour", picker.value, 365);
  alert("Saved! Theme applied.");
});

function resetTheme() {
  deleteCookie("NavColour");
  picker.value = "#009CCC";
  previewBar.style.backgroundColor = "#009CCC";
}

/* INIT */
loadDark();
loadTheme();

/* LOAD PAGE FROM URL */
const page = getPageFromURL() || "general";
openPageById(page);

</script>

</body>
</html>
