<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scrooch Theme Settings</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 2rem;
      background-color: #121212;
      color: #eee;
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
      color: #fff;
      font-weight: 600;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background-color: #1e1e1e;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    label {
      display: block;
      margin-top: 1.2rem;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    input[type="color"] {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      padding: 0;
      background: none;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 2rem;
    }

    button {
      flex: 1;
      margin: 0 0.5rem;
      padding: 0.6rem 0;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
      font-weight: 500;
    }

    #saveButton {
      background-color: #4CAF50;
      color: #fff;
    }

    #saveButton:hover {
      background-color: #45a049;
    }

    #resetButton {
      background-color: #f44336;
      color: #fff;
    }

    #resetButton:hover {
      background-color: #d73833;
    }

    #backButton {
      background-color: #555;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1rem;
      cursor: pointer;
      margin-bottom: 1rem;
      font-weight: 500;
      width: 100%;
      transition: 0.2s;
    }

    #backButton:hover {
      background-color: #666;
    }

    /* PREVIEW MATCHING IMAGE SIZE AND CENTERED */
    .preview {
      margin: 1.5rem auto; /* vertical spacing + horizontal centering */
      padding: 0;
      border-radius: 8px;
      text-align: center;
      transition: background-color 0.2s;

      position: relative;
      overflow: hidden;
      background-color: #009CCC;

      width: 100%; /* fallback if image width not known */
      max-width: 400px; /* match image width in px if known */
      height: 80px;     /* match image height in px */
    }

    .preview::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;

      background-image: url("https://cattymod.app/assets/newnav.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;

      pointer-events: none;
    }

    small {
      display: block;
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <button id="backButton">⬅ Back</button>

    <h1>Theme Settings</h1>

    <label for="navbarColor">Navbar & Custom Button Color:</label>
    <input type="color" id="navbarColor" />

    <div class="buttons">
      <button id="saveButton">💾 Save Theme</button>
      <button id="resetButton">♻ Reset Theme</button>
    </div>

    <div class="preview" id="previewText"></div>

    <small>Press back when you are done.</small>
  </div>

  <script>
    document.getElementById('backButton').addEventListener('click', () => {
      window.location.href = 'https://www.cattymod.app/editor/';
    });

    function setCookie(name, value, days) {
      const d = new Date();
      d.setTime(d.getTime() + (days*24*60*60*1000));
      const expires = "expires=" + d.toUTCString();
      document.cookie = `${name}=${value};${expires};path=/`;
    }

    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
      return null;
    }

    function deleteCookie(name) {
      document.cookie = name + '=; Max-Age=-99999999; path=/';
    }

    const navbarColorInput = document.getElementById('navbarColor');
    const previewText = document.getElementById('previewText');

    const currentColor = getCookie('NavColour');
    if (currentColor) {
      navbarColorInput.value = currentColor;
      previewText.style.backgroundColor = currentColor;
    } else {
      previewText.style.backgroundColor = '#009CCC';
    }

    navbarColorInput.addEventListener('input', () => {
      previewText.style.backgroundColor = navbarColorInput.value;
    });

    document.getElementById('saveButton').addEventListener('click', () => {
      setCookie('NavColour', navbarColorInput.value, 365);
      alert("Success! Click [Back] to see your theme!");
    });

    document.getElementById('resetButton').addEventListener('click', () => {
      deleteCookie('NavColour');
      navbarColorInput.value = '#000000';
      previewText.style.backgroundColor = '#009CCC';
      alert("Theme reset to default!");
    });
  </script>
</body>
</html>
