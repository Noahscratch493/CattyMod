<div class="container">
  <button id="backButton" style="
    background-color: #555;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.5rem 1rem;
    cursor: pointer;
    margin-bottom: 1rem;
    font-weight: 500;
  ">⬅ Back</button>

  <h1>Theme Settings</h1>

  <label for="navbarColor">Navbar & Feedback Button Color:</label>
  <input type="color" id="navbarColor" />

  <div class="buttons">
    <button id="saveButton">💾 Save Theme</button>
    <button id="resetButton">♻ Reset Theme</button>
  </div>

  <div class="preview" id="previewText">
    Preview: Your navbar and button will use this color
  </div>

  <small>Changes will apply when you reload your Scrooch editor.</small>
</div>

<script>
  // Back button redirect
  document.getElementById('backButton').addEventListener('click', () => {
    window.location.href = 'https://www.cattymod.app/editor/';
  });

  // helper to set cookies
  function setCookie(name, value, days) {
    const d = new Date();
    d.setTime(d.getTime() + (days*24*60*60*1000));
    const expires = "expires=" + d.toUTCString();
    document.cookie = `${name}=${value};${expires};path=/`;
  }

  // helper to read cookies
  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
    return null;
  }

  // helper to delete cookies
  function deleteCookie(name) {
    document.cookie = name + '=; Max-Age=-99999999; path=/';
  }

  const navbarColorInput = document.getElementById('navbarColor');
  const previewText = document.getElementById('previewText');

  // load current color if set
  const currentColor = getCookie('NavColour');
  if (currentColor) {
    navbarColorInput.value = currentColor;
    previewText.style.color = currentColor;
  }

  // live preview
  navbarColorInput.addEventListener('input', () => {
    previewText.style.color = navbarColorInput.value;
  });

  // save theme
  document.getElementById('saveButton').addEventListener('click', () => {
    setCookie('NavColour', navbarColorInput.value, 365);
    alert("Theme saved! Reload your Scrooch editor to see changes.");
  });

  // reset theme
  document.getElementById('resetButton').addEventListener('click', () => {
    deleteCookie('NavColour');
    navbarColorInput.value = '#000000';
    previewText.style.color = '#fff';
    alert("Theme reset to default!");
  });
</script>
