<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scrooch Theme Settings</title>
  <style>
    /* Dark theme background */
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 2rem;
      background-color: #121212;
      color: #eee;
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
      color: #fff;
      font-weight: 600;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background-color: #1e1e1e;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    label {
      display: block;
      margin-top: 1.2rem;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    input[type="color"] {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      padding: 0;
      background: none;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 2rem;
    }

    button {
      flex: 1;
      margin: 0 0.5rem;
      padding: 0.6rem 0;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
      font-weight: 500;
    }

    #saveButton {
      background-color: #4CAF50;
      color: #fff;
    }

    #saveButton:hover {
      background-color: #45a049;
    }

    #resetButton {
      background-color: #f44336;
      color: #fff;
    }

    #resetButton:hover {
      background-color: #d73833;
    }

    .preview {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 8px;
      background-color: #2a2a2a;
      text-align: center;
      font-size: 1rem;
      color: #fff;
      transition: color 0.2s, background-color 0.2s;
    }

    small {
      display: block;
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Theme Settings</h1>

    <label for="navbarColor">Navbar & Feedback Button Color:</label>
    <input type="color" id="navbarColor" />

    <div class="buttons">
      <button id="saveButton">💾 Save Theme</button>
      <button id="resetButton">♻ Reset Theme</button>
    </div>

    <div class="preview" id="previewText">
      Preview: Your navbar and button will use this color
    </div>

    <small>Changes will apply when you reload your Scrooch editor.</small>
  </div>

  <script>
    // helper to set cookies
    function setCookie(name, value, days) {
      const d = new Date();
      d.setTime(d.getTime() + (days*24*60*60*1000));
      const expires = "expires=" + d.toUTCString();
      document.cookie = `${name}=${value};${expires};path=/`;
    }

    // helper to read cookies
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
      return null;
    }

    // helper to delete cookies
    function deleteCookie(name) {
      document.cookie = name + '=; Max-Age=-99999999; path=/';
    }

    const navbarColorInput = document.getElementById('navbarColor');
    const previewText = document.getElementById('previewText');

    // load current color if set
    const currentColor = getCookie('NavColour');
    if (currentColor) {
      navbarColorInput.value = currentColor;
      previewText.style.color = currentColor;
    }

    // live preview
    navbarColorInput.addEventListener('input', () => {
      previewText.style.color = navbarColorInput.value;
    });

    // save theme
    document.getElementById('saveButton').addEventListener('click', () => {
      setCookie('NavColour', navbarColorInput.value, 365);
      alert("Theme saved! Reload your Scrooch editor to see changes.");
    });

    // reset theme
    document.getElementById('resetButton').addEventListener('click', () => {
      deleteCookie('NavColour');
      navbarColorInput.value = '#000000';
      previewText.style.color = '#fff';
      alert("Theme reset to default!");
    });
  </script>
</body>
</html>
