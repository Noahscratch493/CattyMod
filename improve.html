<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bugs | CattyMod</title>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #f0f2f5, #e6ecf3);
        color: #333;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
        padding: 20px;
    }

    img {
        max-width: 280px;
        width: 80%;
        margin-bottom: 25px;
        animation: float 3s ease-in-out infinite;
    }

    h1 {
        font-size: 2.8rem;
        margin: 0;
        color: #ff6f61;
    }

    p {
        font-size: 1.1rem;
        margin: 15px 0 30px;
        color: #555;
        max-width: 400px;
    }

    .buttons {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .button {
        background-color: #ff6f61;
        color: white;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: bold;
        transition: 0.25s ease;
        cursor: pointer;
        border: none;
    }

    .button:hover {
        background-color: #ff4c3b;
        transform: translateY(-2px);
    }

    .secondary {
        background-color: #6c757d;
    }

    .secondary:hover {
        background-color: #5a6268;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
    }

    @media (max-width: 500px) {
        h1 { font-size: 2.3rem; }
        p { font-size: 1rem; }
    }
</style>
</head>

<body>

<img src="https://cattymod.app/assets/dango/improve.svg" alt="zzz">

<h1>Our servers are sleepy</h1>
<p>CattyMod is currently being improved and may be a bit buggy. You can go back, or continue anyway at your own risk.</p>

<div class="buttons">
    <a href="https://cattymod.app" class="button secondary">Go Back Home</a>
    <button class="button" onclick="continueAnyway()">Continue Anyways</button>
</div>

<script>
function continueAnyway() {
    // Set cookie for 7 days
    document.cookie = "BugSkip=true; path=/; max-age=" + (60 * 60 * 24 * 7);

    // Redirect
    window.location.href = "https://studio.cattymod.app";
}
</script>

</body>
</html>
